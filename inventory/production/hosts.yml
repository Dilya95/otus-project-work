---
all:
  vars:
    ansible_user: vagrant
    ansible_ssh_private_key_file: ~/.vagrant.d/insecure_private_key
    ansible_python_interpreter: /usr/bin/python3

  children:
    frontends:
      hosts:
        frontend:
          ansible_host: 192.168.56.10
          management_ip: 192.168.56.10
          app_ip: 172.16.20.10

    backends:
      hosts:
        backend01:
          ansible_host: 192.168.56.21
          management_ip: 192.168.56.21
          app_ip: 172.16.20.21
          db_ip: 172.16.30.21

        backend02:
          ansible_host: 192.168.56.22
          management_ip: 192.168.56.22
          app_ip: 172.16.20.22
          db_ip: 172.16.30.22

    databases:
      hosts:
        db01:
          ansible_host: 192.168.56.31
          management_ip: 192.168.56.31
          db_ip: 172.16.30.31
          mariadb_role: primary
          mariadb_server_id: 1

        db02:
          ansible_host: 192.168.56.32
          management_ip: 192.168.56.32
          db_ip: 172.16.30.32
          mariadb_role: replica
          mariadb_server_id: 2

    monitoring_nodes:
      hosts:
        monitoring:
          ansible_host: 192.168.56.40
          management_ip: 192.168.56.40
