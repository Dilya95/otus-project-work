---
- name: Create Alloy group
  ansible.builtin.group:
    name: "{{ alloy_group }}"
    system: true

- name: Create Alloy user
  ansible.builtin.user:
    name: "{{ alloy_user }}"
    group: "{{ alloy_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    groups:
      - systemd-journal
      - adm
    append: true

- name: Create Alloy configuration directory
  ansible.builtin.file:
    path: /etc/alloy
    state: directory
    owner: "{{ alloy_user }}"
    group: "{{ alloy_group }}"
    mode: "0755"

- name: Create Alloy data directory
  ansible.builtin.file:
    path: "{{ alloy_data_dir }}"
    state: directory
    owner: "{{ alloy_user }}"
    group: "{{ alloy_group }}"
    mode: "0755"

- name: Check Alloy binary
  ansible.builtin.stat:
    path: /usr/local/bin/alloy
  register: alloy_binary

- name: Download Alloy
  ansible.builtin.get_url:
    url: "https://github.com/grafana/alloy/releases/download/v{{ alloy_version }}/alloy-linux-arm64.zip"
    dest: "/tmp/alloy-linux-arm64.zip"
    mode: "0644"
  when: not alloy_binary.stat.exists

- name: Install unzip
  ansible.builtin.apt:
    name: unzip
    state: present
    update_cache: false

- name: Extract Alloy
  ansible.builtin.unarchive:
    src: "/tmp/alloy-linux-arm64.zip"
    dest: /tmp
    remote_src: true
  when: not alloy_binary.stat.exists

- name: Install Alloy binary
  ansible.builtin.copy:
    src: /tmp/alloy-linux-arm64
    dest: /usr/local/bin/alloy
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  when: not alloy_binary.stat.exists
  notify: Restart Alloy

- name: Deploy Alloy configuration
  ansible.builtin.template:
    src: config.alloy.j2
    dest: /etc/alloy/config.alloy
    owner: "{{ alloy_user }}"
    group: "{{ alloy_group }}"
    mode: "0644"
  notify: Restart Alloy

- name: Deploy Alloy systemd service
  ansible.builtin.template:
    src: alloy.service.j2
    dest: /etc/systemd/system/alloy.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart Alloy

- name: Enable and start Alloy
  ansible.builtin.systemd:
    name: alloy
    enabled: true
    state: started
    daemon_reload: true
