---
- name: Create Blackbox Exporter group
  ansible.builtin.group:
    name: "{{ blackbox_exporter_group }}"
    system: true

- name: Create Blackbox Exporter user
  ansible.builtin.user:
    name: "{{ blackbox_exporter_user }}"
    group: "{{ blackbox_exporter_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create Blackbox Exporter configuration directory
  ansible.builtin.file:
    path: "{{ blackbox_exporter_config_dir }}"
    state: directory
    owner: "{{ blackbox_exporter_user }}"
    group: "{{ blackbox_exporter_group }}"
    mode: "0755"

- name: Check Blackbox Exporter binary
  ansible.builtin.stat:
    path: /usr/local/bin/blackbox_exporter
  register: blackbox_exporter_binary

- name: Download Blackbox Exporter
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/blackbox_exporter/releases/download/v{{ blackbox_exporter_version }}/blackbox_exporter-{{ blackbox_exporter_version }}.linux-arm64.tar.gz"
    dest: "/tmp/blackbox_exporter-{{ blackbox_exporter_version }}.linux-arm64.tar.gz"
    mode: "0644"
  when: not blackbox_exporter_binary.stat.exists

- name: Extract Blackbox Exporter
  ansible.builtin.unarchive:
    src: "/tmp/blackbox_exporter-{{ blackbox_exporter_version }}.linux-arm64.tar.gz"
    dest: /tmp
    remote_src: true
    creates: "/tmp/blackbox_exporter-{{ blackbox_exporter_version }}.linux-arm64/blackbox_exporter"
  when: not blackbox_exporter_binary.stat.exists

- name: Install Blackbox Exporter binary
  ansible.builtin.copy:
    src: "/tmp/blackbox_exporter-{{ blackbox_exporter_version }}.linux-arm64/blackbox_exporter"
    dest: /usr/local/bin/blackbox_exporter
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  when: not blackbox_exporter_binary.stat.exists
  notify: Restart Blackbox Exporter

- name: Deploy Blackbox Exporter configuration
  ansible.builtin.template:
    src: blackbox.yml.j2
    dest: "{{ blackbox_exporter_config_dir }}/blackbox.yml"
    owner: "{{ blackbox_exporter_user }}"
    group: "{{ blackbox_exporter_group }}"
    mode: "0644"
  notify: Restart Blackbox Exporter

- name: Deploy Blackbox Exporter systemd service
  ansible.builtin.template:
    src: blackbox_exporter.service.j2
    dest: /etc/systemd/system/blackbox_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart Blackbox Exporter

- name: Enable and start Blackbox Exporter
  ansible.builtin.systemd:
    name: blackbox_exporter
    enabled: true
    state: started
    daemon_reload: true
