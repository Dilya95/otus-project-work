---
- name: Update APT cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Install common packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
  become: true

- name: Configure system timezone
  community.general.timezone:
    name: "{{ system_timezone }}"
  become: true

- name: Add project hosts to /etc/hosts
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} ANSIBLE MANAGED PROJECT HOSTS"
    block: |
      {% for host in project_hosts %}
      {{ host.ip }} {{ host.name }}
      {% endfor %}
  become: true

- name: Enable and start Chrony
  ansible.builtin.systemd:
    name: chrony
    enabled: true
    state: started
  become: true
