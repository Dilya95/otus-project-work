---
- name: Require monitoring recovery target
  ansible.builtin.assert:
    that:
      - inventory_hostname in groups['monitoring_nodes']
    fail_msg: "Gluster arbiter recovery can only run on a monitoring node."

- name: Check current Gluster identity
  ansible.builtin.stat:
    path: /var/lib/glusterd/glusterd.info
  register: gluster_arbiter_identity

- name: Detect fresh Gluster arbiter replacement node
  ansible.builtin.set_fact:
    gluster_arbiter_recovery_required: "{{ not gluster_arbiter_identity.stat.exists }}"

- name: Check external Gluster metadata backup
  ansible.builtin.stat:
    path: "{{ gluster_metadata_backup_base_dir }}/{{ inventory_hostname }}/{{ gluster_metadata_backup_file }}"
  register: gluster_arbiter_metadata_backup

- name: Require Gluster metadata backup for fresh arbiter
  ansible.builtin.assert:
    that:
      - not gluster_arbiter_recovery_required or gluster_arbiter_metadata_backup.stat.exists
    fail_msg: >-
      Fresh Gluster arbiter detected, but metadata backup for
      {{ inventory_hostname }} is missing.

- name: Install GlusterFS packages
  ansible.builtin.apt:
    name:
      - glusterfs-server
      - glusterfs-client
      - rsync
    state: present
    update_cache: false

- name: Stop glusterd before metadata restore
  ansible.builtin.systemd:
    name: glusterd
    state: stopped
  when: gluster_arbiter_recovery_required

- name: Remove generated Gluster metadata
  ansible.builtin.file:
    path: /var/lib/glusterd
    state: absent
  when: gluster_arbiter_recovery_required

- name: Restore saved Gluster metadata
  ansible.builtin.unarchive:
    src: "{{ gluster_metadata_backup_base_dir }}/{{ inventory_hostname }}/{{ gluster_metadata_backup_file }}"
    dest: /
    remote_src: true
  when: gluster_arbiter_recovery_required

- name: Create Gluster arbiter brick directory
  ansible.builtin.file:
    path: "{{ wordpress_gluster_arbiter_brick }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Enable and start glusterd
  ansible.builtin.systemd:
    name: glusterd
    enabled: true
    state: started

- name: Wait for Gluster management port
  ansible.builtin.wait_for:
    host: "{{ ansible_host }}"
    port: 24007
    timeout: 60

- name: Wait for recovered arbiter peer to reconnect
  ansible.builtin.shell: |
    set -o pipefail

    gluster peer status |
    grep -A 4 -F "Hostname: {{ ansible_host }}" |
    grep -Fq "Peer in Cluster (Connected)"
  args:
    executable: /bin/bash
  delegate_to: backend01
  register: gluster_arbiter_peer_reconnect
  changed_when: false
  retries: 20
  delay: 3
  until: gluster_arbiter_peer_reconnect.rc == 0
  when: gluster_arbiter_recovery_required

- name: Start Gluster arbiter brick reset
  ansible.builtin.command:
    argv:
      - gluster
      - volume
      - reset-brick
      - "{{ wordpress_gluster_volume }}"
      - "{{ ansible_host }}:{{ wordpress_gluster_arbiter_brick }}"
      - start
  delegate_to: backend01
  when: gluster_arbiter_recovery_required

- name: Commit Gluster arbiter brick reset
  ansible.builtin.command:
    argv:
      - gluster
      - volume
      - reset-brick
      - "{{ wordpress_gluster_volume }}"
      - "{{ ansible_host }}:{{ wordpress_gluster_arbiter_brick }}"
      - "{{ ansible_host }}:{{ wordpress_gluster_arbiter_brick }}"
      - commit
      - force
  delegate_to: backend01
  when: gluster_arbiter_recovery_required

- name: Wait for recovered arbiter brick process
  ansible.builtin.shell: |
    set -o pipefail

    pgrep -f \
      "glusterfsd.*--brick-name {{ wordpress_gluster_arbiter_brick }}" \
      >/dev/null
  args:
    executable: /bin/bash
  register: gluster_arbiter_brick_process
  changed_when: false
  retries: 20
  delay: 3
  until: gluster_arbiter_brick_process.rc == 0
  when: gluster_arbiter_recovery_required

- name: Start full Gluster heal
  ansible.builtin.command:
    argv:
      - gluster
      - volume
      - heal
      - "{{ wordpress_gluster_volume }}"
      - full
  delegate_to: backend01
  register: gluster_arbiter_full_heal
  changed_when: gluster_arbiter_full_heal.rc == 0
  retries: 10
  delay: 3
  until: gluster_arbiter_full_heal.rc == 0
  when: gluster_arbiter_recovery_required

- name: Wait for Gluster heal to complete
  ansible.builtin.shell: |
    set -o pipefail

    output="$(gluster volume heal {{ wordpress_gluster_volume }} info)"
    echo "$output"

    ! echo "$output" | grep -Eq \
      'Number of entries: [1-9][0-9]*|Transport endpoint is not connected'
  args:
    executable: /bin/bash
  delegate_to: backend01
  register: gluster_arbiter_heal
  changed_when: false
  retries: 30
  delay: 5
  until: gluster_arbiter_heal.rc == 0
  when: gluster_arbiter_recovery_required

- name: Refresh Gluster metadata backup
  ansible.builtin.include_role:
    name: gluster_metadata_backup
